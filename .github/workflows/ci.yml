name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload snake game artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-game-files
          if-no-files-found: error
          retention-days: 7
          path: |
            index.html
            index.js
            app.js
            package.json
